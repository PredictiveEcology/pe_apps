# ADD the service below under `services:` in /srv/wbi/docker-compose.yml, and the
# two extra lines marked "caddy:" to the existing caddy service. Nothing else changes.
services:
  firesense-elfmaps:
    image: firesense-elfmaps:v7      # loaded with docker save | docker load (README step 1); not in a registry
    pull_policy: never
    restart: always
    expose:
      - "8080"
    environment:
      # Folder on the Arbutus object store written by publish-data.sh.
      # Arbutus object store, project tenant 529feda02d404836b0e91b1d360b4df0 (as in the wbi bucket rewrite)
      - DATA_URL=https://object-arbutus.alliancecan.ca/529feda02d404836b0e91b1d360b4df0:predictiveecology/firesense/elfmaps

  caddy:
    # add to the existing volumes list:
    #   - ./apps-site:/apps-site:ro
    # add to the existing depends_on list:
    #   - firesense-elfmaps
    volumes:
      - ./apps-site:/apps-site:ro
    depends_on:
      - firesense-elfmaps
